name: Omni Chat foundation validation
on:
  pull_request:
  push:
    branches:
      - main
      - feat/omni-chat-native-foundation
permissions:
  contents: read
jobs:
  identity-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Omni Chat identity contract
        run: node --test tests/omni-chat-identity.test.mjs tests/omni-chat-upstream.test.mjs tests/omni-chat-telemetry-privacy.test.mjs tests/omni-chat-math-security.test.mjs
  production-dependency-advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Block high and critical production advisories
        run: npm audit --omit=dev --audit-level=high --no-fund
  composed-development-credentials:
    runs-on: ubuntu-latest
    env:
      UID: '1000'
      GID: '1000'
      OMNI_MONGO_ROOT_USERNAME: 'omnicitest'
      OMNI_MONGO_ROOT_PASSWORD: 'synthetic_mongo_ci_2026'
      OMNI_POSTGRES_PASSWORD: 'synthetic_pg_ci_2026'
      OMNI_MEILI_MASTER_KEY: 'synthetic_search_ci_key_2026_42'
    steps:
      - uses: actions/checkout@v4
      - name: Prepare synthetic configuration
        run: cp .env.example .env
      - name: Generate effective Compose configuration
        run: docker compose -f docker-compose.yml -f compose.omni-chat.yml config --format json > "$RUNNER_TEMP/omni-chat-compose.json"
      - name: Resolve explicitly enabled administration profile
        run: docker compose -f docker-compose.yml -f compose.omni-chat.yml --profile admin config --format json > "$RUNNER_TEMP/omni-chat-admin-compose.json"
      - name: Validate default and opt-in service configuration
        run: node scripts/verify_omni_compose.mjs "$RUNNER_TEMP/omni-chat-compose.json" "$RUNNER_TEMP/omni-chat-admin-compose.json"
      - name: Reject missing database credentials
        shell: bash
        run: |
          set -euo pipefail
          for key in OMNI_MONGO_ROOT_USERNAME OMNI_MONGO_ROOT_PASSWORD OMNI_POSTGRES_PASSWORD OMNI_MEILI_MASTER_KEY; do
            if env "$key=" docker compose -f docker-compose.yml -f compose.omni-chat.yml config --quiet > "$RUNNER_TEMP/omni-missing-credential.log" 2>&1; then
              echo "::error title=Credential bypass::$key must reject an empty value"
              exit 1
            fi
            if ! grep -Fq "$key" "$RUNNER_TEMP/omni-missing-credential.log"; then
              echo "::error title=Credential validation::$key did not produce a specific error"
              exit 1
            fi
            echo "Required setting $key rejects empty values"
          done
