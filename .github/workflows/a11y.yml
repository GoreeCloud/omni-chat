name: Omni Chat accessibility checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: omni-a11y-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  axe-open-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint changed UI and interaction surfaces
        run: npx eslint client/src/components/Auth/AuthLayout.tsx client/src/hooks/MCP/useAppBridge.ts
      - name: Build production frontend for real rendered page
        run: npm run frontend
      - name: Install isolated headless browser
        run: npx playwright install --with-deps chromium --only-shell
      - name: Check rendered unauthenticated UI with open-source axe-core
        run: node --test tests/omni-chat-accessibility.test.mjs
