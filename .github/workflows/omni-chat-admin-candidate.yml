name: Omni Chat Admin image qualification

on:
  push:
    branches: [feature/omni-admin-image-qualification-20261016]
  pull_request:
    branches: [integrate/omni-chat-dev-20261016]

permissions:
  contents: read

jobs:
  image-candidate:
    name: Admin trial ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            machine: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            machine: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          path: omni-src
      - uses: actions/checkout@v5
        with:
          repository: LibreChat-AI/admin-panel
          ref: 82fb4b61409d5c2e6eceb3d116b89bc957c1620e
          persist-credentials: false
          path: admin-src
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Validate pinned checkout and rejected inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.machine }}"
          python3 -m unittest discover -s omni-src/tests -p test_omni_admin_candidate.py -v
          touch admin-src/.unexpected-untracked
          if python3 omni-src/scripts/prepare_omni_admin_candidate.py admin-src > /tmp/dirty-output.txt 2>&1; then
            echo 'Dirty checkout was accepted' >&2
            exit 1
          fi
          grep -Fq 'Refusing to modify a dirty upstream checkout' /tmp/dirty-output.txt
          rm admin-src/.unexpected-untracked
          python3 omni-src/scripts/prepare_omni_admin_candidate.py admin-src
      - name: Resolve and compile pinned trial source
        working-directory: admin-src
        run: |
          bun install
          bun run build
      - name: Build and check native runtime
        run: |
          set -euo pipefail
          docker build -f admin-src/Dockerfile -t omni-admin-candidate:trial admin-src
          test "$(docker image inspect --format '{{.Architecture}}' omni-admin-candidate:trial)" = "${{ matrix.arch }}"
          docker run --rm --entrypoint bun omni-admin-candidate:trial -e '
            import {existsSync} from "node:fs";
            for (const p of ["eslint", "patch-package", "@eslint/eslintrc"]) {
              if (existsSync("/app/node_modules/" + p)) throw new Error("Development package leaked: " + p);
            }
            for (const p of ["react", "@tanstack/react-start"]) {
              if (!existsSync("/app/node_modules/" + p)) throw new Error("Runtime package missing: " + p);
            }
          '
      - name: Scan unpublished trial image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: omni-admin-candidate:trial
          format: json
          output: admin-candidate-trivy.json
          scanners: vuln
          severity: CRITICAL,HIGH,MEDIUM,LOW
          ignore-unfixed: false
          exit-code: '0'
      - name: Fail closed on critical or high findings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          report = json.loads(Path("admin-candidate-trivy.json").read_text())
          results = report.get("Results") or []
          if not results:
              raise SystemExit("No scan results")
          findings = [v for r in results for v in (r.get("Vulnerabilities") or [])]
          severe = [v for v in findings if v.get("Severity") in ("CRITICAL", "HIGH")]
          print("Critical/high findings:", len(severe))
          if severe:
              raise SystemExit("Admin trial image did not qualify")
          PY
      - name: Preserve scan evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: omni-admin-image-${{ matrix.arch }}-trial
          path: admin-candidate-trivy.json
          if-no-files-found: warn
          retention-days: 7
