name: Omni Chat OCI image security gate (isolated)

on:
  push:
    branches:
      - audit/omni-chat-oci-20261016

permissions:
  contents: read

jobs:
  inspect-pinned-image:
    name: Trivy ${{ matrix.service }} ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: rag-api
            arch: amd64
            image: registry.librechat.ai/librechat-ai/librechat-rag-api-dev-lite@sha256:a62ce2221b43a9bb57fa6cb733e7047c80132960272c33d5704028f3071a1251
          - service: rag-api
            arch: arm64
            image: registry.librechat.ai/librechat-ai/librechat-rag-api-dev-lite@sha256:a62ce2221b43a9bb57fa6cb733e7047c80132960272c33d5704028f3071a1251
          - service: admin-panel
            arch: amd64
            image: registry.librechat.ai/clickhouse/librechat-admin-panel@sha256:a395465d1daa3c11495810a8c224df86675985d50de42e98e36eeedbd8aecb94
          - service: admin-panel
            arch: arm64
            image: registry.librechat.ai/clickhouse/librechat-admin-panel@sha256:a395465d1daa3c11495810a8c224df86675985d50de42e98e36eeedbd8aecb94
    steps:
      - uses: actions/checkout@v5
      - name: Test fail-closed audit policy
        run: python3 -m unittest discover -s tests -p 'test_omni_oci_gate.py'
      - name: Scan exact pinned OCI index without running its image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: json
          output: trivy-image-report.json
          scanners: vuln,license
          severity: CRITICAL,HIGH,MEDIUM,LOW
          ignore-unfixed: false
          exit-code: '0' # Write evidence; separate step enforces a failure.
        env:
          TRIVY_PLATFORM: linux/${{ matrix.arch }}
      - name: Fail closed on unverifiable platform or critical findings
        run: |
          python3 scripts/omni_oci_gate.py \
            --report trivy-image-report.json \
            --image '${{ matrix.image }}' \
            --arch '${{ matrix.arch }}' \
            --max-critical 0
      - name: Preserve scan evidence even when the gate rejects images
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: omni-chat-oci-${{ matrix.service }}-${{ matrix.arch }}-audit
          path: trivy-image-report.json
          if-no-files-found: warn
          retention-days: 7
