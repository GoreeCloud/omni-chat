  <defs>
    <linearGradient id="omni-canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111b3b"/>
      <stop offset="1" stop-color="#17102f"/>
    </linearGradient>
    <linearGradient id="omni-shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b75ff"/>
