# Source-built development overlay. Requires new authenticated MongoDB volume.
# Existing unauthenticated data volumes require backup and explicit migration.
services:
  api:
    container_name: omni-chat
    image: goreecloud/omni-chat:development
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - APP_TITLE=Omni Chat
      - HELP_AND_FAQ_URL=/
      - MONGO_URI=mongodb://${OMNI_MONGO_ROOT_USERNAME:?Set OMNI_MONGO_ROOT_USERNAME}:${OMNI_MONGO_ROOT_PASSWORD:?Set OMNI_MONGO_ROOT_PASSWORD}@mongodb:27017/OmniChat?authSource=admin
  mongodb:
    command: ["mongod", "--auth", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${OMNI_MONGO_ROOT_USERNAME:?Set OMNI_MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${OMNI_MONGO_ROOT_PASSWORD:?Set OMNI_MONGO_ROOT_PASSWORD}
