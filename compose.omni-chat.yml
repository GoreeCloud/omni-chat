# Development-only source build overlay (not production-qualified).
# Requires NEW database volumes; existing MongoDB/PostgreSQL volumes need migration.
services:
  api:
    container_name: omni-chat
    image: goreecloud/omni-chat:development
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - APP_TITLE=Omni Chat
      - HELP_AND_FAQ_URL=/
      - MONGO_URI=mongodb://${OMNI_MONGO_ROOT_USERNAME:?Set OMNI_MONGO_ROOT_USERNAME}:${OMNI_MONGO_ROOT_PASSWORD:?Set OMNI_MONGO_ROOT_PASSWORD}@mongodb:27017/OmniChat?authSource=admin
  admin-panel:
    # Opt in explicitly with --profile admin. The inherited image is still
    # third-party and must not be part of the default development stack.
    profiles: [admin]
    environment:
      SESSION_COOKIE_SECURE: 'true'
  mongodb:
    command: ["mongod", "--auth", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${OMNI_MONGO_ROOT_USERNAME:?Set OMNI_MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${OMNI_MONGO_ROOT_PASSWORD:?Set OMNI_MONGO_ROOT_PASSWORD}
  vectordb:
    environment:
      POSTGRES_DB: OmniChatVectors
      POSTGRES_USER: omnic
      POSTGRES_PASSWORD: ${OMNI_POSTGRES_PASSWORD:?Set OMNI_POSTGRES_PASSWORD}
  rag_api:
    environment:
      - POSTGRES_DB=OmniChatVectors
      - POSTGRES_USER=omnic
      - POSTGRES_PASSWORD=${OMNI_POSTGRES_PASSWORD:?Set OMNI_POSTGRES_PASSWORD}
